hf:
  repo_id: "Meddies/SynthAudio"   # REQUIRED — no implicit default in code
  private: false
  revision: "main"
  token_secret: "huggingface"     # Modal Secret holding HF_TOKEN (write scope)

refs:
  # Switch by editing source + dir together; app.py mounts both Volumes and every
  # variant stays uploaded, so flipping back never re-uploads anything.
  #   visec        source: visec  dir: /refs/visec      147 spk, emotional, no transcripts
  #   vivos 10s    source: vivos  dir: /refs/vivos/v10   65 spk, read speech, transcripts
  #   vivos 30s    source: vivos  dir: /refs/vivos/v30   same 65 spk, ~29.6s references
  # target_seconds must match the dir suffix -- it is what build-refs and the plan
  # hash use, so a mismatch would silently generate from the wrong variant.
  source: "vivos"
  dir: "/refs/vivos/v30"
  target_seconds: 30

speaker:
  policy: per_conversation        # or per_turn
  pool: all                       # or a path to a file of allowed speaker_ids
  seed_salt: "v1"                 # bump to reshuffle every voice

engine:
  concurrency: 48                 # MUST be <= max_num_seqs
  max_num_seqs: 64
  max_num_batched_tokens: 16384
  cfg_value: 2.0
  temperature: 1.0
  inference_timesteps: 26
  gpu_memory_utilization: 0.94    # more KV-cache headroom for concurrent sequences;
                                   # pilot should sweep this alongside concurrency

text:
  chunk_max_chars: 130          # fixed budget; ~8.4s at VIVOS's 15.56 chars/s
  chunk_overflow_chars: 14      # absorb a sentence rather than open a chunk for <=14 chars
  chars_per_sec: 14.0           # calibrated by the pilot; budget = target x this
  silence_ms: 250
  max_chars: 3000
  min_ttr: 0.35
  max_ngram_repeat: 4

run:
  gpu: "A100-40GB"
  convs_per_shard: 122
  budget_usd: null
  configs: ["vietnamese"]
