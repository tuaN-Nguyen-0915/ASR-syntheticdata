# Pilot config — 3 conversations (~37 utterances) to npat1509/TestSynth.
# Purpose: measure the REAL chars/sec (every cost figure depends on it),
# hear the audio, and prove the Modal path end to end. Not a production run.
hf:
  repo_id: "npat1509/TestSynth"
  private: false
refs:
  # Switch by editing source + dir together. app.py mounts both Volumes and every
  # variant stays uploaded, so flipping back never re-uploads anything.
  #   visec        source: visec  dir: /refs/visec      147 spk, emotional, no transcripts
  #   vivos 10s    source: vivos  dir: /refs/vivos/v10   65 spk, read speech, transcripts
  #   vivos 30s    source: vivos  dir: /refs/vivos/v30   same 65 spk, ~29.6s references
  # target_seconds must match the dir suffix -- it is what build-refs and the plan
  # hash use, so a mismatch would silently generate from the wrong variant.
  source: "vivos"
  dir: "/refs/vivos/v30"    # v10 or v30 — one subdir per duration variant
  target_seconds: 30

speaker:
  policy: per_conversation
  seed_salt: "pilot-v1"
engine:
  concurrency: 16          # modest for a 1-shard pilot; sweep later
  max_num_seqs: 64
  gpu_memory_utilization: 0.94
  cfg_value: 2.0
  temperature: 1.0
  inference_timesteps: 26
text:
  chunk_max_chars: 130
  chunk_overflow_chars: 14
  chars_per_sec: 14.0      # UNMEASURED assumption — the pilot replaces this
run:
  gpu: "A100-40GB"
  convs_per_shard: 3       # all 3 conversations in ONE shard
  configs: ["vietnamese"]
